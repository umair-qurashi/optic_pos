<script>
(()=>{
'use strict';
const KEY='optidesk_shop_data_v1';
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const defaultData=()=>({settings:{shopName:'OptiDesk Optical',tagline:'Clear vision, better living',ownerName:'',phone:'',whatsapp:'',email:'',address:'',website:'',instagram:'',facebook:'',currency:'PKR',lowStock:5,logo:'',fontScale:110,orderPrefix:'OPT',orderStart:1001},lenses:[],orders:[],customers:[],invoices:[],activities:[],nextOrder:1001});
let data=loadData(),page='dashboard',settingsTab='profile',selectedSlip=null,toastTimer,pendingFrameImage='',editingOrderId=null,inventoryFilter='all';
function loadData(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaultData();const d=JSON.parse(raw);const base=defaultData();return {...base,...d,settings:{...base.settings,...(d.settings||{})},lenses:d.lenses||[],orders:d.orders||[],customers:d.customers||[],invoices:d.invoices||[],activities:d.activities||[]}}catch(e){return defaultData()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){notify('Could not save. Device storage may be full. Export a backup and remove large images.','error');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){const val=Number(n||0);try{return new Intl.NumberFormat('en-PK',{style:'currency',currency:data.settings.currency||'PKR',maximumFractionDigits:0}).format(val)}catch{return (data.settings.currency||'PKR')+' '+val.toLocaleString('en-US')}}
function fmtDate(v){if(!v)return '—';const d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDateTime(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function notify(msg,type='success'){const root=$('#toastRoot');root.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}
function initial(s){return (s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function setPage(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function openOrderInForm(id){const o=orderById(id);if(!o)return;closeModal();editingOrderId=id;pendingFrameImage=o.frameImage||'';setPage('new-order');}
function pageTitle(p){return ({dashboard:'Dashboard','new-order':'Add New Order',orders:'Orders',inventory:'Inventory',customers:'Customers',invoices:'Invoices',settings:'Shop Settings'})[p]||'OptiDesk'}
function updateBrand(){const s=data.settings;$('#brandName').textContent=s.shopName||'OptiDesk';$('#brandMark').innerHTML=s.logo?`<img src="${s.logo}" alt="Shop logo">`:'◉';$('#todayDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function applyFontScale(){const n=Math.max(90,Math.min(140,Number(data.settings.fontScale)||110));document.documentElement.style.setProperty('--font-scale',String(n/100));}
function render(){applyFontScale();updateBrand();document.body.classList.toggle('page-dashboard',page==='dashboard');document.body.classList.toggle('page-inventory',page==='inventory');$('#topTitle').textContent=pageTitle(page);const c=$('#content');if(page==='dashboard')c.innerHTML=dashboardHTML();else if(page==='new-order')c.innerHTML=newOrderHTML();else if(page==='orders')c.innerHTML=ordersHTML();else if(page==='inventory')c.innerHTML=inventoryHTML();else if(page==='customers')c.innerHTML=customersHTML();else if(page==='invoices')c.innerHTML=invoicesHTML();else if(page==='settings')c.innerHTML=settingsHTML();if(page==='new-order')setTimeout(()=>{if($('#orderForm'))refreshOrderSummary()},0);}
function validOrders(){return data.orders.filter(o=>o.status!=='Cancelled')}
function collected(o){return (o.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0)}
function balance(o){return Math.max(0,Number(o.total||0)-collected(o))}
function paymentStatus(o){const b=balance(o);return b<=0?'Paid':collected(o)>0?'Partial':'Unpaid'}
function statusClass(s){return ({Pending:'status-pending','In Progress':'status-progress',Ready:'status-ready',Completed:'status-completed',Cancelled:'status-cancelled',Paid:'status-paid',Partial:'status-partial',Unpaid:'status-pending'})[s]||'status-pending'}
function pill(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}
function orderById(id){return data.orders.find(o=>o.id===id)}
function customerById(id){return data.customers.find(c=>c.id===id)}
function invoiceByOrder(id){return data.invoices.find(i=>i.orderId===id)}
function inventoryCategory(item){return String(item?.category||'Lens').trim()||'Other'}
function inventoryUnit(item){return String(item?.unit||(inventoryCategory(item).toLowerCase()==='lens'?'pairs':'pcs'))}
function isLowInventoryItem(item){return Number(item.stock||0)<=Number(item.reorder??data.settings.lowStock)}
function inventoryStat(label,value,icon,tone,filter){
 const bg=tone==='green'?'#e9f7f1':tone==='amber'?'#fff5df':'#edf4ff';
 const color=tone==='green'?'#16865d':tone==='amber'?'#b7791f':'#3676d9';
 const active=(filter==='low'&&inventoryFilter==='low')||(filter==='all'&&inventoryFilter==='all');
 return `<button type="button" class="stat-card inventory-stat-card ${active?'is-active':''} ${filter==='low'?'is-low-stat':''}" data-action="inventory-filter" data-filter="${filter}" aria-pressed="${active}">
  <span class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon" style="background:${bg};color:${color}">${icon}</span></span>
  <span class="stat-value">${value}</span><span class="stat-foot">${filter==='low'?'Tap to view low stock':filter==='all'?'Tap to show all items':''}</span><span class="stat-accent"></span>
 </button>`;
}
function inventoryVisibleItems(){
 const q=($('#lensSearch')?.value||'').trim().toLowerCase();
 return data.lenses.filter(item=>{
  const matchesFilter=inventoryFilter==='low'?isLowInventoryItem(item):true;
  const matchesSearch=(item.name+' '+inventoryCategory(item)+' '+(item.type||'')).toLowerCase().includes(q);
  return matchesFilter&&matchesSearch;
 });
}

function addActivity(text){data.activities.unshift({id:uid(),text,at:new Date().toISOString()});data.activities=data.activities.slice(0,30)}
function dashboardHTML(){
 const orders=[...data.orders].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
 const active=validOrders(),pending=active.filter(o=>o.status==='Pending');
 const pendingValue=pending.reduce((s,o)=>s+Number(o.total||0),0);
 const received=active.reduce((s,o)=>s+collected(o),0);
 const low=data.lenses.filter(l=>Number(l.stock)<=Number(l.reorder||data.settings.lowStock));
 const logo=data.settings.logo?`<img src="${data.settings.logo}" alt="Shop logo">`:'◉';
 return `<div class="home-dashboard">
  <header class="home-brand-head">
   <div class="home-brand-main"><div class="home-brand-logo">${logo}</div><div class="home-brand-copy"><strong>${esc(data.settings.shopName||'OptiDesk Optical')}</strong><span>${esc(data.settings.tagline||'Clear vision, better living')}</span></div></div>
   <button class="home-settings-btn" data-page="settings" aria-label="Shop settings">⚙</button>
   <div class="home-tabs"><button class="active" data-action="home-transactions">Transaction Details</button><button data-page="customers">Party Details</button></div>
  </header>
  <section class="home-quick-panel"><div class="home-section-title">Quick Links</div>
   <div class="home-quick-grid">

function normalizeRxOption(value, options, fallback='0.00'){
 const raw=String(value??'').trim();
 if(options.includes(raw))return raw;
 if(raw!==''){
  const numeric=Number(raw);
  if(Number.isFinite(numeric)){
   const match=options.find(option=>Math.abs(Number(option)-numeric)<1e-8);
   if(match)return match;
  }
 }
 return fallback;
}

}

function settingsHTML(){const s=data.settings;return `<div class="page-head"><div><h1>Shop settings</h1><p>Set up your shop identity and manage local data backups.</p></div><button class="btn btn-primary" data-action="save-settings">Save changes</button></div><div class="settings-layout"><section class="panel settings-tabs"><button class="${settingsTab==='profile'?'active':''}" data-settings-tab="profile">▣ &nbsp;Shop profile</button><button class="${settingsTab==='contact'?'active':''}" data-settings-tab="contact">☎ &nbsp;Contact & social</button><button class="${settingsTab==='preferences'?'active':''}" data-settings-tab="preferences">⚙ &nbsp;Preferences</button><button class="${settingsTab==='backup'?'active':''}" data-settings-tab="backup">⇩ &nbsp;Backup & data</button></section><section class="settings-content">${settingsTab==='profile'?profileSettings(s):settingsTab==='contact'?contactSettings(s):settingsTab==='preferences'?preferenceSettings(s):backupSettings()}</section></div>`}

" value="${esc(prefix)}" maxlength="12" placeholder="e.g. OPT or ABC"><div class="helper">Use your own shop code. Leave blank to remove the prefix.</div></div><div class="field"><label>Starting number</label><input class="input setting-input" data-key="orderStart" type="number" min="1" step="1" value="${start}"><div class="helper">First sequence number for initial setup. Existing orders are never renumbered or duplicated.</div></div><div class="field full"><div class="amount-box"><div class="amount-line"><span>Number preview</span><strong>${esc(preview)}</strong></div><div class="helper">Applies to new orders only. Existing order and invoice numbers will not change.</div></div></div></div></section><section class="form-card"><h3 class="section-title">How stock sync works</h3><p style="font-size:calc(11px * var(--font-scale,1));color:var(--muted);line-height:1.7;margin:0">Only the lens selected from inventory is deducted when a new order is generated. Frame details and photos are saved with the order but do not affect stock. If an order is cancelled, its lens quantity is returned to inventory. Receiving a payment does not change lens stock.</p></section>`}

function canvasWrapLines(ctx,text,maxWidth){const result=[];String(text??'—').split('\n').forEach(paragraph=>{const words=paragraph.split(/\s+/);let line='';for(const word of words){const test=line?line+' '+word:word;if(line&&ctx.measureText(test).width>maxWidth){result.push(line);line=word}else line=test}result.push(line||' ') });return result}

function handleFrameImage(file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)){notify('Choose a JPG, PNG or WEBP image.','error');return}if(file.size>8*1024*1024){notify('Frame photo must be smaller than 8 MB.','error');return}const reader=new FileReader();reader.onerror=()=>notify('Could not read this image. Please try another file.','error');reader.onload=()=>{const img=new Image();img.onerror=()=>notify('Could not open this image. Please try another file.','error');img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);try{pendingFrameImage=canvas.toDataURL('image/jpeg',0.78);renderFrameImagePreview();notify('Frame photo added to this order.')}catch(err){notify('Could not process this image.','error')}};img.src=String(reader.result)};reader.readAsDataURL(file)}
function syncOrderReceivedAmount(o,desired){
 const target=Math.max(0,Number(desired)||0);
 const payments=Array.isArray(o.payments)?o.payments.slice():[];
 let difference=target-collected(o);
 if(difference>0.0001){
  payments.push({id:uid(),amount:Number(difference.toFixed(2)),date:today(),method:'Manual adjustment',note:'Amount received adjusted while editing order',createdAt:new Date().toISOString()});
 }else if(difference< -0.0001){
  let toReduce=Math.abs(difference);
  for(let i=payments.length-1;i>=0&&toReduce>0.0001;i--){
   const amount=Math.max(0,Number(payments[i].amount)||0);
   if(!amount)continue;
   const reduction=Math.min(amount,toReduce);
   const remaining=Number((amount-reduction).toFixed(2));
   toReduce=Number((toReduce-reduction).toFixed(2));
   if(remaining<=0.0001)payments.splice(i,1);
   else payments[i].amount=remaining;
  }
 }
 o.payments=payments;
 o.advance=target;
}

document.addEventListener('submit',e=>{if(e.target.id==='orderForm'){e.preventDefault();if(!e.target.reportValidity())return;if(editingOrderId)updateExistingOrder(e.target);else createOrder(e.target)}else if(e.target.id==='lensForm'){e.preventDefault();if(!e.target.reportValidity())return;const fd=new FormData(e.target);const category=String(fd.get('category')||'Other').trim()||'Other';const unit=String(fd.get('unit')||(category.toLowerCase()==='lens'?'pairs':'pcs'));data.lenses.push({id:uid(),name:String(fd.get('name')).trim(),category,unit,type:'',price:Number(fd.get('price')),stock:Number(fd.get('stock')),reorder:Number(fd.get('reorder')||data.settings.lowStock),description:'',createdAt:new Date().toISOString()});addActivity(`Inventory item ${fd.get('name')} added`);save();closeModal();render();notify('Item added to inventory.') } });
document.addEventListener('reset',e=>{if(e.target.id==='orderForm'){pendingFrameImage='';editingOrderId=null;setTimeout(renderFrameImagePreview,0)}});
document.addEventListener('input',e=>{if(e.target.id==='homeSearch'){const q=e.target.value.trim().toLowerCase();const list=[...data.orders].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).filter(o=>{const inv=invoiceByOrder(o.id);return [o.customerName,o.whatsapp,o.orderNo,inv?.invoiceNo].join(' ').toLowerCase().includes(q)});const root=$('#homeOrderList');if(root)root.innerHTML=homeOrderCards(list)}if(e.target.id==='customerNameInput'){const selected=$('#selectedCustomerId');if(selected)selected.value='';renderCustomerSuggestions(e.target.value)}if(e.target.id==='customerWhatsAppInput'){const key=normalizeWhatsApp(e.target.value),selected=$('#selectedCustomerId');if(selected)selected.value='';if(selected&&key.length>=10){const match=data.customers.find(c=>normalizeWhatsApp(c.whatsapp)===key);if(match){selected.value=match.id;const nameInput=$('#customerNameInput');if(nameInput&&!nameInput.value.trim())nameInput.value=match.name||''}}}if(e.target.id==='orderSearch')filterOrders();if(e.target.id==='customerSearch')filterCustomers();if(e.target.id==='invoiceSearch')filterInvoices();if(e.target.id==='lensSearch')filterLenses();if(e.target.id==='orderTotal'){e.target.dataset.manual='1';refreshOrderSummary()}if(e.target.id==='orderAdvance')refreshOrderSummary();if(e.target.id==='lensQty'){const f=$('#orderForm'),l=f&&data.lenses.find(x=>x.id===f.lensId.value);if(l&&!$('#orderTotal').dataset.manual)$('#orderTotal').value=String(Number(l.price)*Math.max(1,Number(e.target.value||1)));refreshOrderSummary()}});
document.addEventListener('change',e=>{if(e.target.id==='orderFilter'||e.target.id==='paymentFilter')filterOrders();if(e.target.id==='invoiceFilter')filterInvoices();if(e.target.id==='orderLens'){const f=$('#orderForm'),l=data.lenses.find(x=>x.id===e.target.value);if(l&&f&&!$('#orderTotal').dataset.manual)$('#orderTotal').value=String(Number(l.price)*Math.max(1,Number(f.lensQty.value||1)));refreshOrderSummary()}if(e.target.id==='frameImageFileGallery'||e.target.id==='frameImageFileCamera'){handleFrameImage(e.target.files?.[0])}if(e.target.id==='logoFile'){const file=e.target.files?.[0];if(!file)return;if(file.size>1024*1024){notify('Logo must be smaller than 1 MB.','error');e.target.value='';return}const r=new FileReader();r.onload=()=>{data.settings.logo=String(r.result);save();render()};r.readAsDataURL(file)}if(e.target.id==='importFile'){importJSON(e.target.files?.[0]);e.target.value=''}});
$('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#mobileOverlay').classList.add('show')});$('#mobileOverlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show')});
window.addEventListener('beforeunload',save);
render();
})();
